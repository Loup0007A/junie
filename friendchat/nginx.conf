# Nginx reverse-proxy config for FriendChat
# Place in /etc/nginx/sites-available/friendchat
# Then: ln -s /etc/nginx/sites-available/friendchat /etc/nginx/sites-enabled/
# And:  nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name chat.yoursite.com;   # ← change to your domain

    # Redirect HTTP → HTTPS (uncomment after getting SSL cert)
    # return 301 https://$host$request_uri;

    # ── Proxy to Node.js ──────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Required for Socket.io WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;   # keep WS connections alive
        proxy_send_timeout  3600s;
    }

    # ── Static uploads (optional: serve directly from nginx) ──
    location /uploads/ {
        alias /var/www/friendchat/server/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 10M;
}

