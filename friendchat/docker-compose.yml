version: '3.9'

services:
  friendchat:
    build: .
    container_name: friendchat
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:4000}
      - NODE_ENV=production
    volumes:
      - friendchat_data:/app/server/data
      - friendchat_uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  friendchat_data:
  friendchat_uploads:
